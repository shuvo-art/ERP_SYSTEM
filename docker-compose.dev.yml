version: '3.8'

services:
  # Database Service
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: erp_db_dev
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_SA_PASSWORD}
    ports:
      - "1433:1433"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${DB_SA_PASSWORD} -C -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      retries: 5
      start_period: 20s
    networks:
      - erp_network
    volumes:
      - mssql_data_dev:/var/opt/mssql

  # Database Initializer
  db-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: erp_db_init_dev
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sql:/sql
    entrypoint: /bin/bash
    command: -c "/opt/mssql-tools/bin/sqlcmd -S db -U sa -P ${DB_SA_PASSWORD} -C -i /sql/auth/init-auth.sql && /opt/mssql-tools/bin/sqlcmd -S db -U sa -P ${DB_SA_PASSWORD} -C -i /sql/products/init-products.sql && /opt/mssql-tools/bin/sqlcmd -S db -U sa -P ${DB_SA_PASSWORD} -C -i /sql/target-market/init-target-market.sql && /opt/mssql-tools/bin/sqlcmd -S db -U sa -P ${DB_SA_PASSWORD} -C -i /sql/partners/init-partners.sql && /opt/mssql-tools/bin/sqlcmd -S db -U sa -P ${DB_SA_PASSWORD} -C -i /sql/reference-projects/init-reference-projects.sql && /opt/mssql-tools/bin/sqlcmd -S db -U sa -P ${DB_SA_PASSWORD} -C -i /sql/jobs/init-jobs.sql && /opt/mssql-tools/bin/sqlcmd -S db -U sa -P ${DB_SA_PASSWORD} -C -i /sql/contact/init-contact.sql && /opt/mssql-tools/bin/sqlcmd -S db -U sa -P ${DB_SA_PASSWORD} -C -i /sql/about-us/init-about-us.sql"
    networks:
      - erp_network

  # Auth API
  auth-api:
    build:
      context: .
      dockerfile: src/Auth.Api/Dockerfile
    image: erp-auth-api:dev
    container_name: auth_api_dev
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=Master;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - erp_network

  # Product API
  product-api:
    build:
      context: .
      dockerfile: src/ProductApi.Api/Dockerfile
    image: erp-product-api:dev
    container_name: product_api_dev
    restart: always
    ports:
      - "8083:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=Master;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - erp_network

  # Target Market API
  target-market-api:
    build:
      context: .
      dockerfile: src/TargetMarketApi.Api/Dockerfile
    image: erp-target-market-api:dev
    container_name: target_market_api_dev
    restart: always
    ports:
      - "8084:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=Master;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - erp_network

  # Partner API
  partner-api:
    build:
      context: .
      dockerfile: src/PartnerApi.Api/Dockerfile
    image: erp-partner-api:dev
    container_name: partner_api_dev
    restart: always
    ports:
      - "8085:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=Master;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - erp_network

  # Reference Project API
  reference-project-api:
    build:
      context: .
      dockerfile: src/ReferenceProjectApi.Api/Dockerfile
    image: erp-reference-project-api:dev
    container_name: reference_project_api_dev
    restart: always
    ports:
      - "8086:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=Master;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - erp_network

  # Job API
  job-api:
    build:
      context: .
      dockerfile: src/JobApi.Api/Dockerfile
    image: erp-job-api:dev
    container_name: job_api_dev
    restart: always
    ports:
      - "8087:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=Master;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - erp_network

  # Contact API
  contact-api:
    build:
      context: .
      dockerfile: src/ContactApi.Api/Dockerfile
    image: erp-contact-api:dev
    container_name: contact_api_dev
    restart: always
    ports:
      - "8088:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=Master;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - erp_network

  # About Us API
  about-us-api:
    build:
      context: .
      dockerfile: src/AboutUsApi.Api/Dockerfile
    image: erp-about-us-api:dev
    container_name: about_us_api_dev
    restart: always
    ports:
      - "8089:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=Master;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - erp_network

  # Redis
  redis:
    image: redis:alpine
    container_name: erp_redis_dev
    restart: always
    ports:
      - "6379:6379"
    networks:
      - erp_network

  # Nginx Gateway
  nginx:
    image: nginx:alpine
    container_name: erp_gateway_dev
    restart: always
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-api
      - product-api
      - target-market-api
      - partner-api
      - reference-project-api
      - job-api
      - contact-api
      - about-us-api
    networks:
      - erp_network

  # Adminer
  adminer:
    image: adminer
    container_name: adminer_dev
    restart: always
    ports:
      - "8081:8080"
    networks:
      - erp_network

networks:
  erp_network:
    driver: bridge

volumes:
  mssql_data_dev:
