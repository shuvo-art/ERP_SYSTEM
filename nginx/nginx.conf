events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Upstream definitions for each microservice
    upstream auth_svr {
        server auth-api:8080;
    }

    upstream product_svr {
        server product-api:8080;
    }

    upstream target_market_svr {
        server target-market-api:8080;
    }

    upstream partner_svr {
        server partner-api:8080;
    }

    upstream reference_project_svr {
        server reference-project-api:8080;
    }

    upstream job_svr {
        server job-api:8080;
    }

    upstream contact_svr {
        server contact-api:8080;
    }

    upstream about_us_svr {
        server about-us-api:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Standard headers for proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Auth Service
        location /api/v1/Auth {
            proxy_pass http://auth_svr;
        }
        location /api/v1/User {
            proxy_pass http://auth_svr;
        }

        # Contact Service
        location /api/v1/Distributors {
            proxy_pass http://contact_svr;
        }
        location /api/v1/Enquiries {
            proxy_pass http://contact_svr;
        }

        # Job Service
        location /api/v1/Jobs {
            proxy_pass http://job_svr;
        }
        location /api/v1/Applications {
            proxy_pass http://job_svr;
        }

        # Product Service
        location /api/v1/Products {
            proxy_pass http://product_svr;
        }

        # Partner Service
        location /api/v1/Partners {
            proxy_pass http://partner_svr;
        }

        # Reference Project Service
        location /api/v1/ReferenceProjects {
            proxy_pass http://reference_project_svr;
        }

        # Target Market Service
        location /api/v1/TargetMarkets {
            proxy_pass http://target_market_svr;
        }

        # About Us Service
        location /api/v1/AboutUs {
            proxy_pass http://about_us_svr;
        }
        
        # Health check or root
        location / {
            return 200 'ERP System Gateway OK';
            add_header Content-Type text/plain;
        }
    }
}
