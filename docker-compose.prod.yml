version: '3.8'

services:
  # Database Service (Using official image)
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: erp_db_prod
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_SA_PASSWORD}
    ports:
      - "1433:1433"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${DB_SA_PASSWORD} -C -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      retries: 5
      start_period: 20s
    networks:
      - erp_network
    volumes:
      - mssql_data:/var/opt/mssql

  # Database Initializer (Custom production image)
  db-init:
    image: shuvo83qn/erp-db-init:latest
    build:
      context: ./sql
      dockerfile: Dockerfile
    container_name: erp_db_init_prod
    depends_on:
      db:
        condition: service_healthy
    command: -c "/opt/mssql-tools/bin/sqlcmd -S db -U sa -P ${DB_SA_PASSWORD} -C -i /sql/auth/init-auth.sql && /opt/mssql-tools/bin/sqlcmd -S db -U sa -P ${DB_SA_PASSWORD} -C -i /sql/products/init-products.sql && /opt/mssql-tools/bin/sqlcmd -S db -U sa -P ${DB_SA_PASSWORD} -C -i /sql/target-market/init-target-market.sql && /opt/mssql-tools/bin/sqlcmd -S db -U sa -P ${DB_SA_PASSWORD} -C -i /sql/partners/init-partners.sql && /opt/mssql-tools/bin/sqlcmd -S db -U sa -P ${DB_SA_PASSWORD} -C -i /sql/reference-projects/init-reference-projects.sql && /opt/mssql-tools/bin/sqlcmd -S db -U sa -P ${DB_SA_PASSWORD} -C -i /sql/jobs/init-jobs.sql && /opt/mssql-tools/bin/sqlcmd -S db -U sa -P ${DB_SA_PASSWORD} -C -i /sql/contact/init-contact.sql && /opt/mssql-tools/bin/sqlcmd -S db -U sa -P ${DB_SA_PASSWORD} -C -i /sql/about-us/init-about-us.sql"
    networks:
      - erp_network

  # Auth API
  auth-api:
    image: shuvo83qn/erp-auth-api:latest
    build:
      context: .
      dockerfile: src/Auth.Api/Dockerfile
    container_name: auth_api_prod
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Database=Master;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
      - RedisSettings__InstanceName=Auth_Prod
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__AccessTokenExpirationMinutes=${JWT_ACCESS_TOKEN_EXPIRATION}
      - JwtSettings__RefreshTokenExpirationDays=${JWT_REFRESH_TOKEN_EXPIRATION}
      - EmailSettings__SmtpHost=${SMTP_HOST}
      - EmailSettings__SmtpPort=${SMTP_PORT}
      - EmailSettings__SmtpUser=${SMTP_USER}
      - EmailSettings__SmtpPass=${SMTP_PASS}
      - EmailSettings__FromEmail=${SMTP_FROM_EMAIL}
      - EmailSettings__FromName=${SMTP_FROM_NAME}
      - EmailSettings__EnableSsl=${SMTP_ENABLE_SSL}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - erp_network

  # Product API
  product-api:
    image: shuvo83qn/erp-product-api:latest
    build:
      context: .
      dockerfile: src/ProductApi.Api/Dockerfile
    container_name: product_api_prod
    ports:
      - "8083:8080"
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Database=Master;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - erp_network

  # Target Market API
  target-market-api:
    image: shuvo83qn/erp-target-market-api:latest
    build:
      context: .
      dockerfile: src/TargetMarketApi.Api/Dockerfile
    container_name: target_market_api_prod
    ports:
      - "8084:8080"
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Database=Master;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - erp_network

  # Partner API
  partner-api:
    image: shuvo83qn/erp-partner-api:latest
    build:
      context: .
      dockerfile: src/PartnerApi.Api/Dockerfile
    container_name: partner_api_prod
    ports:
      - "8085:8080"
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Database=Master;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - erp_network

  # Reference Project API
  reference-project-api:
    image: shuvo83qn/erp-reference-project-api:latest
    build:
      context: .
      dockerfile: src/ReferenceProjectApi.Api/Dockerfile
    container_name: reference_project_api_prod
    ports:
      - "8086:8080"
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Database=Master;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - erp_network

  # Job API
  job-api:
    image: shuvo83qn/erp-job-api:latest
    build:
      context: .
      dockerfile: src/JobApi.Api/Dockerfile
    container_name: job_api_prod
    ports:
      - "8087:8080"
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Database=Master;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - erp_network

  # Contact API
  contact-api:
    image: shuvo83qn/erp-contact-api:latest
    build:
      context: .
      dockerfile: src/ContactApi.Api/Dockerfile
    container_name: contact_api_prod
    ports:
      - "8088:8080"
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Database=Master;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - erp_network

  # About Us API
  about-us-api:
    image: shuvo83qn/erp-about-us-api:latest
    build:
      context: .
      dockerfile: src/AboutUsApi.Api/Dockerfile
    container_name: about_us_api_prod
    ports:
      - "8089:8080"
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Database=Master;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - erp_network

  # Redis (Official image)
  redis:
    image: redis:alpine
    container_name: erp_redis_prod
    restart: always
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - erp_network
    volumes:
      - redis_data:/data

  # Nginx Gateway (Custom baked image)
  nginx:
    image: shuvo83qn/erp-gateway:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: erp_gateway_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - auth-api
      - product-api
      - target-market-api
      - partner-api
      - reference-project-api
      - job-api
      - contact-api
      - about-us-api
    networks:
      - erp_network

  # Adminer (Optional in Prod, usually restricted)
  adminer:
    image: adminer
    container_name: adminer_prod
    restart: always
    ports:
      - "8081:8080"
    networks:
      - erp_network

networks:
  erp_network:
    driver: bridge

volumes:
  mssql_data:
  redis_data:
