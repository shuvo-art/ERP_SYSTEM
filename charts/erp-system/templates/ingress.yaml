apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-auth-api
                port:
                  number: 80
          - path: /api/products
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-product-api
                port:
                  number: 80
          - path: /api/about-us
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-about-us-api
                port:
                  number: 80
          # Add other paths...
