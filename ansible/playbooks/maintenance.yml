---
# This playbook handles routine maintenance tasks
# Use cases: Security patching, OS updates, rebooting servers.
# Usage: ansible-playbook -i inventory/prod/hosts.ini playbooks/maintenance.yml

- name: System Maintenance and Security Updates
  hosts: all
  become: yes
  serial: 1  # Update one server at a time to maintain availability (in a cluster)

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
      tags: [update]

    - name: Upgrade all packages
      apt:
        upgrade: dist
      tags: [update, upgrade]

    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required
      tags: [reboot]

    - name: Reboot if required
      reboot:
        msg: "Rebooting due to system updates"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami
      when: reboot_required.stat.exists
      tags: [reboot]
