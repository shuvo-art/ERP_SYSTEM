---
# Master Playbook (Orchestrator)
#
# This playbook imports other specialized playbooks.
# It acts as the "Single Source of Truth" for the entire infrastructure state.
#
# Usage:
# Dev: ansible-playbook -i inventory/dev/hosts.ini site.yml
# Prod: ansible-playbook -i inventory/prod/hosts.ini site.yml

# 1. Provision Infrastructure (Install Docker, Users, Base Config)
- import_playbook: playbooks/provision.yml

# 2. You could import deployment playbooks here in the future
# - import_playbook: playbooks/deploy_app.yml
